<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@physarif</title>
  <meta name="description" content="আরিফ - পদার্থবিজ্ঞানের ছাত্র এবং ওয়েব ডেভেলপার।" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #08090a;
      --surface: #111214;
      --surface2: #18191d;
      --border: #1f2025;
      --border2: #2a2b32;
      --text: #f0f0f0;
      --muted: #6b6d78;
      --muted2: #9a9daa;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --green: #22d3a3;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans Bengali', 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30vh; left: 50%;
      transform: translateX(-50%);
      width: 80vw; height: 60vh;
      background: radial-gradient(ellipse, rgba(108,99,255,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.6; transform: scale(0.85); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── HERO ── */
    .hero {
      padding: 24px 0 32px;
      animation: fadeUp 0.7s ease both;
    }
    .hero::after {
      content: '';
      display: table;
      clear: both;
    }
    .avatar-wrap {
      float: left;
      margin-right: 18px;
      margin-bottom: 8px;
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 17px;
      object-fit: cover;
      border: 2px solid var(--border2);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.15);
      display: block;
    }
    .avatar-info {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .avatar-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      display: inline-block;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    .avatar-info h1 {
      font-family: 'Sora', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    /* ── BIO TYPING ── */
    .bio-text {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--muted2);
      min-height: 5.4em;
    }
    .bio-text strong { color: var(--text); font-weight: 500; }
    .bio-cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--accent2);
      vertical-align: text-bottom;
      margin-left: 2px;
      border-radius: 1px;
      animation: blink 0.9s step-end infinite;
    }
    .bio-cursor.hidden { display: none; }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 24px;
      animation: fadeUp 0.7s 0.2s ease both;
    }
    .divider span {
      font-family: 'Sora', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border2);
    }

    /* ── PROJECT CARDS ── */
    .projects {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 40px;
      animation: fadeUp 0.7s 0.3s ease both;
    }
    .card {
      display: block;
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      transition: border-color 0.25s, background 0.25s, transform 0.2s, box-shadow 0.25s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(108,99,255,0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: 14px;
    }
    .card:hover {
      border-color: var(--accent);
      background: var(--surface2);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(108,99,255,0.12);
    }
    .card:hover::before { opacity: 1; }
    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-name {
      font-family: 'Sora', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .card-arrow {
      color: var(--muted);
      flex-shrink: 0;
      transition: color 0.2s, transform 0.2s;
    }
    .card:hover .card-arrow { color: var(--accent2); transform: translateX(3px); }
    .card-tag {
      font-family: 'Sora', sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .tag-ecom   { background: rgba(251,191,36,0.12);  color: #fbbf24; }
    .tag-comm   { background: rgba(34,211,163,0.1);   color: #22d3a3; }
    .tag-social { background: rgba(167,139,250,0.12); color: var(--accent2); }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 0;
      animation: fadeUp 0.7s 0.4s ease both;
    }
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    footer p {
      font-family: 'Sora', sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      line-height: 1;
    }
    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .footer-socials {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .f-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      background: transparent;
      border: none;
      color: var(--muted2);
      text-decoration: none;
      transition: color 0.2s, transform 0.2s;
    }
    .f-icon svg { width: 15px; height: 15px; }
    .f-icon:hover { color: var(--text); transform: translateY(-1px); }

    @media (max-width: 480px) {
      .hero { padding: 20px 0 24px; }
      .avatar-wrap { margin-right: 14px; }
      .avatar { width: 76px; height: 76px; border-radius: 14px; }
      .avatar-info h1 { font-size: 1.3rem; }
      .card { padding: 14px 16px; }
    }
  </style>

  <script>
    /* ── Typing Effect ── */
    const bioSegments = [
      { text: 'আমি আরিফ, ', strong: false },
      { text: 'পদার্থবিজ্ঞানে', strong: true },
      { text: ' অনার্স করছি। তবে ', strong: false },
      { text: 'কোডিং', strong: true },
      { text: ' করতে ও নতুন নতুন ওয়েব প্রজেক্ট তৈরি করতে ভালোবাসি। কাজের ফাঁকে ', strong: false },
      { text: 'টেকনোলজির', strong: true },
      { text: ' সাথে সবসময় আপডেট থাকার চেষ্টা করি।', strong: false },
    ];

    const bioContainer = document.getElementById('bioText');
    const cursor = document.getElementById('bioCursor');
    const chars = [];
    for (const seg of bioSegments)
      for (const ch of [...seg.text])
        chars.push({ ch, strong: seg.strong });

    let charIndex = 0, currentNode = null, currentStrong = null;

    function typeNext() {
      if (charIndex >= chars.length) {
        setTimeout(() => cursor.classList.add('hidden'), 1800);
        return;
      }
      const { ch, strong } = chars[charIndex];
      if (strong) {
        if (!currentStrong) {
          currentStrong = document.createElement('strong');
          bioContainer.insertBefore(currentStrong, cursor);
        }
        currentStrong.textContent += ch;
      } else {
        currentStrong = null;
        if (!currentNode || currentNode.nodeType !== Node.TEXT_NODE) {
          currentNode = document.createTextNode('');
          bioContainer.insertBefore(currentNode, cursor);
        }
        currentNode.textContent += ch;
      }
      const next = chars[charIndex + 1];
      if (next && next.strong !== strong) {
        currentNode = null;
        if (!next.strong) currentStrong = null;
      }
      charIndex++;
      const delay = /[\s।,]/.test(ch) ? 55 + Math.random() * 30
                  : /[।!?]/.test(ch)  ? 120 + Math.random() * 60
                  : 28 + Math.random() * 22;
      setTimeout(typeNext, delay);
    }
    setTimeout(typeNext, 900);
  </script>
