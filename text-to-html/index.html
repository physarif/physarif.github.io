<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog HTML Generator</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
<style>
  :root{
    --ink:#202124;
    --sub:#5f6368;
    --paper:#f1f3f4;
    --surface:#ffffff;
    --line:#e3e5e8;
    --accent:#FF5722;
    --accent-dark:#e64a19;
    --accent-soft:#fde7de;
    --mono-bg:#202124;
    --mono-ink:#e8eaed;
    --radius:12px;
    --gap:20px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    border-top:4px solid var(--accent);
    background:var(--paper);
    color:var(--ink);
    font-family:'Roboto','Hind Siliguri',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:32px 18px 72px;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding-bottom:24px;
    margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  header .mark{
    width:38px;
    height:38px;
    flex:none;
    border-radius:9px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:1.3rem;
    font-weight:700;
    box-shadow:0 3px 10px rgba(255,87,34,.3);
  }
  header .title-block{flex:1;}
  header h1{
    font-size:1.4rem;
    font-weight:700;
    margin:0 0 5px;
    letter-spacing:.1px;
    color:var(--ink);
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:.9rem;
  }

  section{margin-bottom:var(--gap);}
  section.stack{display:flex; flex-direction:column; gap:var(--gap);}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:0 1px 2px rgba(32,33,36,.05);
  }
  .card + .card{margin-top:var(--gap);}

  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .card-head h2{
    font-size:.98rem;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  .tag{
    font-size:.68rem;
    background:var(--accent-soft);
    color:var(--accent-dark);
    padding:3px 10px;
    border-radius:20px;
    font-weight:600;
    letter-spacing:.2px;
  }

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:.8rem;
    color:var(--sub);
    margin-bottom:6px;
  }
  input[type="text"], input[type="url"]{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:.92rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{color:#9aa0a6;}
  input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  #editor-container{
    display:flex;
    flex-direction:column;
    border-radius:8px;
    transition:box-shadow .15s ease;
  }
  #editor-container:focus-within{
    box-shadow:0 0 0 3px var(--accent-soft);
    border-radius:8px;
  }
  .ql-toolbar.ql-snow{
    border-radius:8px 8px 0 0;
    border-color:var(--line);
    background:#fafafa;
    padding:10px 12px;
  }
  .ql-container.ql-snow{
    border-radius:0 0 8px 8px;
    border-color:var(--line);
    font-size:1rem;
    font-family:'Hind Siliguri',system-ui,sans-serif;
    height:auto;
  }
  .ql-editor{
    padding:16px;
    min-height:260px;
  }
  .ql-editor.ql-blank::before{
    color:#9aa0a6;
    font-style:normal;
    font-family:'Hind Siliguri',system-ui,sans-serif;
  }
  .ql-toolbar.ql-snow .ql-math{
    width:28px;
    height:24px;
    padding:0;
    font-size:13px;
    line-height:24px;
    color:#444;
    background:transparent;
    border:none;
    cursor:pointer;
    border-radius:3px;
    vertical-align:middle;
  }
  .ql-toolbar.ql-snow .ql-math:hover{
    color:var(--accent);
  }

  .editor-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
    font-size:.78rem;
    color:#9aa0a6;
  }
  .draft-status{
    display:inline-flex;
    align-items:center;
    gap:5px;
    min-height:1.2em;
  }
  .draft-status.saving{color:#9aa0a6;}
  .draft-status.saved{color:#1e8e3e;}
  .draft-status.restored{color:var(--accent-dark);}
  .hint{
    font-size:.78rem;
    color:#9aa0a6;
    margin:12px 0 0;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    font-size:.92rem;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:transform .12s ease, opacity .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(.98);}

  .btn-primary{
    background:var(--accent);
    color:#fff;
    width:100%;
    padding:15px;
    box-shadow:0 2px 8px rgba(255,87,34,.28);
  }
  .btn-primary:hover{background:var(--accent-dark);}

  .btn-secondary{
    background:var(--accent-soft);
    color:var(--accent-dark);
    padding:8px 16px;
    font-size:.82rem;
  }
  .btn-secondary:hover{background:#fbd6c7;}
  .btn-secondary.copied{
    background:#e2f3e5;
    color:#1e8e3e;
  }

  .btn-outline{
    background:#fff;
    border:1px solid var(--line);
    color:var(--sub);
  }
  .btn-outline:hover{
    background:#f5f5f5;
  }

  #outputCard{display:none;}

  .output-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }

  .field-label{
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--sub);
    font-weight:600;
    margin:0 0 8px;
  }

  textarea#output{
    width:100%;
    height:200px;
    padding:16px;
    border:1px solid #353639;
    border-radius:8px;
    background:var(--mono-bg);
    color:var(--mono-ink);
    font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    font-size:.78rem;
    line-height:1.6;
    resize:vertical;
    direction:ltr;
    text-align:left;
  }
  textarea#output:focus{outline:none;}

  .preview-wrap{margin-top:22px;}
  .preview{
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px;
    background:#fff;
    max-height:420px;
    overflow:auto;
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Blog HTML Generator</h1>
      <p>Generate clean, ready-to-paste HTML</p>
    </div>
    <div class="mark"><i class="fa-brands fa-blogger-b"></i></div>
  </header>

  <section class="stack">

    <div class="card">
      <div class="card-head">
        <h2>Featured Image</h2>
        <span class="tag">Optional</span>
      </div>
      <div class="field">
        <label for="imgUrl">Image URL</label>
        <input type="url" id="imgUrl" placeholder="https://..." />
      </div>
      <div class="field">
        <label for="imgAlt">Alt / Title text</label>
        <input type="text" id="imgAlt" placeholder="e.g. Elon Musk" />
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Content</h2>
      </div>
      <div id="editor-container">
        <div id="editor"></div>
      </div>
      <div class="editor-footer">
        <span id="wordCount">0 words</span>
        <span id="draftStatus" class="draft-status"></span>
      </div>
    </div>

    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary" id="generateBtn" style="flex:1; width:auto;">Generate HTML</button>
      <button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button>
    </div>

    <div class="card" id="outputCard">
      <div class="output-head">
        <h2 style="font-size:.98rem; font-weight:600; margin:0;">Output HTML</h2>
        <button class="btn btn-secondary" id="copyBtn">Copy</button>
      </div>
      <textarea id="output" readonly spellcheck="false"></textarea>
      <div class="preview-wrap">
        <p class="field-label">Preview</p>
        <div class="preview" id="previewBox"></div>
      </div>
    </div>

  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.js"></script>
<script>
  function toEmbedUrl(url){
    // Convert common YouTube watch/share links to an embeddable URL
    const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
    if(ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
    return url;
  }

  const quill = new Quill('#editor', {
    theme: 'snow',
    placeholder: 'Start writing your blog post here...',
    modules: {
      toolbar: {
        container: [
          [{ header: 2 }],
          ['bold', 'italic', 'underline'],
          ['blockquote', 'code-block'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['link', 'image', 'video'],
          ['clean']
        ],
        handlers: {
          image: function(){
            const url = prompt('Enter image URL:');
            if(!url) return;
            const range = this.quill.getSelection(true);
            this.quill.insertEmbed(range.index, 'image', url, 'user');
            this.quill.setSelection(range.index + 1);
          },
          video: function(){
            const url = prompt('Enter video URL (YouTube link works):');
            if(!url) return;
            const range = this.quill.getSelection(true);
            this.quill.insertEmbed(range.index, 'video', toEmbedUrl(url), 'user');
            this.quill.setSelection(range.index + 1);
          }
        }
      }
    }
  });

  // --- Word count ---
  function updateWordCount(){
    const text = quill.getText().trim();
    const words = text.length ? text.split(/\s+/).length : 0;
    document.getElementById('wordCount').textContent = words + (words === 1 ? ' word' : ' words');
  }

  // --- Draft status indicator ---
  function setDraftStatus(state){
    const el = document.getElementById('draftStatus');
    el.classList.remove('saving', 'saved', 'restored');
    if(state === 'saving'){
      el.classList.add('saving');
      el.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
    } else if(state === 'saved'){
      el.classList.add('saved');
      el.innerHTML = '<i class="fa-solid fa-circle-check"></i> Saved';
    } else if(state === 'restored'){
      el.classList.add('restored');
      el.innerHTML = '<i class="fa-solid fa-clock-rotate-left"></i> Draft restored';
    }
  }

  // --- Draft autosave (localStorage) ---
  const DRAFT_KEY = 'blogHtmlGenerator:draft';

  function saveDraft(){
    try{
      const draft = {
        content: quill.root.innerHTML,
        imgUrl: document.getElementById('imgUrl').value,
        imgAlt: document.getElementById('imgAlt').value
      };
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
      setDraftStatus('saved');
    }catch(e){
      // localStorage unavailable (e.g. inside a sandboxed preview) — fail silently
    }
  }

  function restoreDraft(){
    try{
      const raw = localStorage.getItem(DRAFT_KEY);
      if(!raw) return;
      const draft = JSON.parse(raw);
      if(draft.content) quill.root.innerHTML = draft.content;
      if(draft.imgUrl) document.getElementById('imgUrl').value = draft.imgUrl;
      if(draft.imgAlt) document.getElementById('imgAlt').value = draft.imgAlt;
      setDraftStatus('restored');
    }catch(e){
      // ignore corrupt or inaccessible drafts
    }
  }

  restoreDraft();
  updateWordCount();

  let saveTimer = null;
  function scheduleSave(){
    setDraftStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 400);
  }
  quill.on('text-change', scheduleSave);
  quill.on('text-change', updateWordCount);
  document.getElementById('imgUrl').addEventListener('input', scheduleSave);
  document.getElementById('imgAlt').addEventListener('input', scheduleSave);

  (function addMathToolbarButton(){
    const codeBtn = document.querySelector('.ql-toolbar .ql-code-block');
    if(!codeBtn) return;
    const mathBtn = document.createElement('button');
    mathBtn.type = 'button';
    mathBtn.className = 'ql-math';
    mathBtn.setAttribute('aria-label', 'Insert Math');
    mathBtn.title = 'Insert Math (LaTeX)';
    mathBtn.innerHTML = '<i class="fa-solid fa-square-root-variable"></i>';
    codeBtn.insertAdjacentElement('afterend', mathBtn);

    mathBtn.addEventListener('click', () => {
      const latex = prompt('Enter LaTeX (e.g. x^2 + y^2 = z^2):');
      if(!latex) return;
      const range = quill.getSelection(true) || { index: quill.getLength() };
      const imgUrl = 'https://latex.codecogs.com/svg.image?' + encodeURIComponent(latex);
      quill.insertEmbed(range.index, 'image', imgUrl, 'user');
      quill.setSelection(range.index + 1);
    });
  })();

  function styleImagesInFragment(container){
    container.querySelectorAll('img').forEach(img => {
      img.removeAttribute('class');
      img.removeAttribute('style');
      img.setAttribute('style', 'border-radius: 8px; height: auto; max-width: 100%;');
      const wrapper = document.createElement('div');
      wrapper.setAttribute('style', 'text-align: center; margin: 20px 0px;');
      img.parentNode.insertBefore(wrapper, img);
      wrapper.appendChild(img);
    });
  }

  function styleHeadingsInFragment(container){
    // h1 headings become h2 (single top-level heading style)
    container.querySelectorAll('h1').forEach(h1 => {
      const h2 = document.createElement('h2');
      h2.innerHTML = h1.innerHTML;
      h1.parentNode.replaceChild(h2, h1);
    });

    container.querySelectorAll('h2').forEach(h => {
      h.removeAttribute('class');
      h.setAttribute('style', 'text-align: left; margin: 6px 0 2px 0; font-size: 20px; font-weight: 600;');
    });

    container.querySelectorAll('h3').forEach(h => {
      h.removeAttribute('class');
      h.setAttribute('style', 'text-align: left; margin: 4px 0 2px 0; font-size: 17px; font-weight: 600;');
    });

    container.querySelectorAll('h4').forEach(h => {
      h.removeAttribute('class');
      h.setAttribute('style', 'text-align: left;');
    });
  }

  function removeEmptySpacerParagraphs(container){
    container.querySelectorAll('p').forEach(p => {
      if(p.innerHTML.trim() === '<br>' || p.innerHTML.trim() === ''){
        p.remove();
      }
    });
  }

  function styleCodeBlocksInFragment(container){
    container.querySelectorAll('pre').forEach(pre => {
      pre.removeAttribute('class');
      pre.setAttribute(
        'style',
        'background: #23241f; color: #f8f8f2; padding: 14px 16px; border-radius: 8px; ' +
        'overflow-x: auto; font-family: Consolas, Monaco, monospace; font-size: 14px; ' +
        'line-height: 1.5; white-space: pre; text-align: left; margin: 20px 0px;'
      );
    });
  }

  function styleVideosInFragment(container){
    container.querySelectorAll('iframe').forEach(iframe => {
      iframe.removeAttribute('class');
      iframe.removeAttribute('width');
      iframe.removeAttribute('height');
      iframe.setAttribute('style', 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;');
      iframe.setAttribute('allowfullscreen', 'true');
      const ratioBox = document.createElement('div');
      ratioBox.setAttribute('style', 'position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;');
      const wrapper = document.createElement('div');
      wrapper.setAttribute('style', 'margin: 20px 0px;');
      iframe.parentNode.insertBefore(wrapper, iframe);
      wrapper.appendChild(ratioBox);
      ratioBox.appendChild(iframe);
    });
  }

  function buildFeaturedBlock(){
    const url = document.getElementById('imgUrl').value.trim();
    const alt = document.getElementById('imgAlt').value.trim();
    if(!url) return '';
    const altAttr = alt ? alt : '';
    return `  <div style="text-align: center;"><img alt="${altAttr}" src="${url}" style="border-radius: 8px; height: auto; max-width: 100%;" title="${altAttr}" /></div>\n\n`;
  }

  function generateHTML(){
    const raw = quill.root.innerHTML;
    const temp = document.createElement('div');
    temp.innerHTML = raw;
    styleImagesInFragment(temp);
    styleHeadingsInFragment(temp);
    styleVideosInFragment(temp);
    styleCodeBlocksInFragment(temp);
    removeEmptySpacerParagraphs(temp);

    // trim trailing empty paragraph Quill sometimes leaves
    let bodyInner = temp.innerHTML.trim();

    const featured = buildFeaturedBlock();

    const output =
`<div style="font-family: Arial, sans-serif; font-size: 18px; line-height: 1.8; margin: auto; max-width: 800px; padding: 1px; text-align: justify;">

${featured}  ${bodyInner}

</div>`;

    document.getElementById('output').value = output;
    document.getElementById('previewBox').innerHTML = output;
    document.getElementById('outputCard').style.display = 'block';
    document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('generateBtn').addEventListener('click', generateHTML);

  document.getElementById('cancelBtn').addEventListener('click', () => {
    if(!confirm('Clear everything? This cannot be undone.')) return;

    quill.setText('');
    document.getElementById('imgUrl').value = '';
    document.getElementById('imgAlt').value = '';
    document.getElementById('output').value = '';
    document.getElementById('previewBox').innerHTML = '';
    document.getElementById('outputCard').style.display = 'none';

    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}

    updateWordCount();
    const statusEl = document.getElementById('draftStatus');
    statusEl.classList.remove('saving', 'saved', 'restored');
    statusEl.innerHTML = '';
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const ta = document.getElementById('output');
    ta.select();
    navigator.clipboard.writeText(ta.value).then(() => {
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  });
</script>

</body>
</html>
