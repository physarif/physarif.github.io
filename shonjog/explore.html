<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অনুসন্ধান - আলোচনা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        })();

        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        darkBg: '#0b0e11', 
                        darkCard: '#15191c', 
                        darkBorder: '#2d333b', 
                        accent: '#1d9bf0'
                    } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .forum-card { transition: all 0.2s; border-left: 3px solid transparent; cursor: pointer; }
        .forum-card:hover { border-left-color: #1d9bf0; transform: translateY(-2px); }
        .line-clamp-3 {
            display: -webkit-box !important;
            -webkit-line-clamp: 3 !important;
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
            white-space: normal !important;
            word-break: break-word;
        }
        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin-top: 0.75rem;
            border: 1px solid #2d333b;
        }
        .skeleton {
            background: #eee;
            background-image: linear-gradient(90deg, #eee 0%, #f5f5f5 20%, #eee 40%, #eee 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            animation: shimmer 1.5s infinite linear;
        }
        .dark .skeleton { background: #1a1f24; background-image: linear-gradient(90deg, #1a1f24 0%, #242a30 20%, #1a1f24 40%, #1a1f24 100%); }
        @keyframes shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        mark { background: rgba(29, 155, 240, 0.2); color: inherit; border-radius: 2px; padding: 0 1px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 min-h-screen pb-10">

<header class="sticky top-0 z-50 bg-gray-50/80 dark:bg-darkBg/80 backdrop-blur-md border-b dark:border-darkBorder">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center gap-2">
        <button id="smart-back-btn" class="p-2 hover:bg-gray-200 dark:hover:bg-darkCard rounded-full transition-colors flex-shrink-0">
            <div id="icon-container">
                <svg id="back-icon" class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <svg id="cross-icon" class="w-6 h-6 text-gray-600 dark:text-gray-300 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
        </button>
        
        <div class="relative flex-1 flex items-center bg-white dark:bg-darkCard border dark:border-darkBorder rounded-xl shadow-sm focus-within:border-accent transition-all overflow-hidden">
            <input type="text" id="search-input" placeholder="খুঁজুন..." 
                class="w-full pl-4 pr-12 py-2.5 bg-transparent text-sm outline-none">
            
            <button id="search-btn" class="absolute right-0 inset-y-0 px-3 flex items-center bg-gray-100 dark:bg-gray-800 text-gray-500 hover:text-accent border-l dark:border-darkBorder transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
        </div>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-6">
    <div id="search-history-section" class="mb-8 hidden">
        <div class="flex justify-between items-center mb-4 px-1">
            <h2 class="text-[10px] font-black uppercase text-gray-400 tracking-widest">সাম্প্রতিক অনুসন্ধান</h2>
            <button id="clear-history" class="text-[10px] font-bold text-red-400">সব মুছুন</button>
        </div>
        <div id="search-history-list" class="flex flex-wrap gap-2 px-1"></div>
    </div>

    <div id="suggested-users-section" class="mb-8 hidden">
        <h2 class="text-[10px] font-black uppercase text-gray-400 mb-4 tracking-widest px-1">ফলো করুন</h2>
        <div id="suggested-users-list" class="flex items-start justify-start gap-4 overflow-x-auto no-scrollbar px-1"></div>
    </div>

    <div id="results-container" class="space-y-4"></div>

    <div id="popular-tags-section" class="mt-12 hidden">
        <h2 class="text-[10px] font-black uppercase text-gray-400 mb-4 tracking-widest px-1">জনপ্রিয় ট্যাগ</h2>
        <div id="popular-tags-list" class="flex flex-wrap gap-2 px-1"></div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCXGkduHCDLLNxkOU59asVJl5J3oOAp3HE",
        authDomain: "my-interactive-project-2b460.firebaseapp.com",
        projectId: "my-interactive-project-2b460",
        storageBucket: "my-interactive-project-2b460.firebasestorage.app",
        messagingSenderId: "196849485958",
        appId: "1:196849485958:web:fdd3b3d5e898cd197be907",
        measurementId: "G-HNHSWST7WS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const BASE_PATH = 'blog_comments/pages/forum_v2_voted';

    let allPosts = [];
    let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
    
    const searchInput = document.getElementById('search-input');
    const container = document.getElementById('results-container');
    const authorSection = document.getElementById('suggested-users-section');
    const tagSection = document.getElementById('popular-tags-section');
    const historySection = document.getElementById('search-history-section');

    function timeAgo(seconds) {
        if (!seconds) return 'এই মাত্র';
        const diff = Math.floor(Date.now() / 1000) - seconds;
        const bnNumbers = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
        if (diff < 60) return 'এই মাত্র';
        const units = [
            { label: 'বছর', sec: 31536000 }, { label: 'মাস', sec: 2592000 },
            { label: 'দিন', sec: 86400 }, { label: 'ঘণ্টা', sec: 3600 },
            { label: 'মিনিট', sec: 60 }
        ];
        for (const unit of units) {
            const count = Math.floor(diff / unit.sec);
            if (count >= 1) return count.toString().split('').map(d => bnNumbers[d] || d).join('') + " " + unit.label + " আগে";
        }
        return 'এই মাত্র';
    }

    function getYoutubeId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
    
    const updateIcon = () => {
        if (searchInput.value.trim() !== "" || container.innerHTML !== "") {
            document.getElementById('back-icon').classList.add('hidden');
            document.getElementById('cross-icon').classList.remove('hidden');
        } else {
            document.getElementById('back-icon').classList.remove('hidden');
            document.getElementById('cross-icon').classList.add('hidden');
        }
    };

    const toggleMainSections = (show) => {
        if(show) {
            authorSection.classList.remove('hidden');
            tagSection.classList.remove('hidden');
        } else {
            authorSection.classList.add('hidden');
            tagSection.classList.add('hidden');
            historySection.classList.add('hidden');
        }
    }

    onSnapshot(collection(db, BASE_PATH), (snapshot) => {
        allPosts = snapshot.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.parentId);
        renderSuggestions();
        renderPopularTags();
        const tagParam = new URLSearchParams(window.location.search).get('tag');
        if (tagParam) fillSearch(tagParam);
    });

    const renderSuggestions = () => {
        const usersMap = new Map();
        allPosts.forEach(p => { if (p.name && p.uid) usersMap.set(p.uid, { name: p.name, photo: p.photoURL, uid: p.uid }); });
        const topUsers = Array.from(usersMap.values()).sort(() => 0.5 - Math.random()).slice(0, 10);
        if (topUsers.length > 0) {
            authorSection.classList.remove('hidden');
            document.getElementById('suggested-users-list').innerHTML = topUsers.map(u => `
                <a href="profile.html?uid=${u.uid}" class="flex flex-col items-center gap-2 min-w-[64px] flex-shrink-0">
                    <img src="${u.photo || 'https://ui-avatars.com/api/?name='+u.name}" class="w-12 h-12 rounded-full border-2 border-transparent object-cover bg-gray-200">
                    <span class="text-[9px] font-bold text-gray-500 truncate w-full text-center">${u.name}</span>
                </a>
            `).join('');
        }
    };

    const renderPopularTags = () => {
        let tags = [];
        allPosts.forEach(p => { if (p.hashtags) tags.push(...p.hashtags); });
        const sortedTags = [...new Set(tags)].slice(0, 15);
        if (sortedTags.length > 0) {
            tagSection.classList.remove('hidden');
            document.getElementById('popular-tags-list').innerHTML = sortedTags.map(tag => `
                <button onclick="fillSearch('${tag}')" class="px-3 py-1.5 bg-white dark:bg-darkCard border dark:border-darkBorder rounded-lg text-xs hover:text-accent">#${tag.replace('#', '')}</button>
            `).join('');
        }
    };

    const renderHistory = () => {
        if (searchHistory.length === 0 || searchInput.value.trim() !== "") {
            historySection.classList.add('hidden');
            return;
        }
        historySection.classList.remove('hidden');
        document.getElementById('search-history-list').innerHTML = searchHistory.map((item, index) => `
            <div class="flex items-center bg-white dark:bg-darkCard border dark:border-darkBorder rounded-full pl-3 pr-1 py-1">
                <span class="text-xs cursor-pointer" onclick="fillSearch('${item}')">${item}</span>
                <button onclick="removeFromHistory(${index})" class="ml-2 p-1 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        `).join('');
    };

    window.removeFromHistory = (i) => { searchHistory.splice(i, 1); localStorage.setItem('searchHistory', JSON.stringify(searchHistory)); renderHistory(); };
    document.getElementById('clear-history').onclick = () => { searchHistory = []; localStorage.setItem('searchHistory', JSON.stringify([])); renderHistory(); };

    window.fillSearch = (term) => { 
        searchInput.value = term; 
        performSearch(); 
    };

    const highlightText = (text, term) => {
        if (!term) return text;
        const regex = new RegExp(`(${term})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    };

    const performSearch = () => {
        const term = searchInput.value.toLowerCase().trim();
        if (!term) return;
        searchHistory = [term, ...searchHistory.filter(h => h !== term)].slice(0, 8);
        localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        container.innerHTML = `<div class="w-full h-32 skeleton rounded-xl mb-4"></div>`;
        toggleMainSections(false);
        updateIcon();
        setTimeout(() => {
            let filtered = allPosts.filter(p => 
                (p.msg && p.msg.toLowerCase().includes(term)) || 
                (p.name && p.name.toLowerCase().includes(term)) ||
                (p.hashtags && p.hashtags.some(t => t.toLowerCase().includes(term)))
            );
            renderResults(filtered, term);
        }, 500);
    };

    document.getElementById('smart-back-btn').onclick = () => {
        if (searchInput.value.trim() !== "" || container.innerHTML !== "") {
            searchInput.value = "";
            container.innerHTML = "";
            toggleMainSections(true);
            updateIcon();
        } else {
            location.href = 'index.html';
        }
    };

    searchInput.onfocus = () => { toggleMainSections(false); renderHistory(); };
    searchInput.oninput = () => { updateIcon(); if(!searchInput.value.trim()) renderHistory(); else historySection.classList.add('hidden'); };
    searchInput.onkeydown = (e) => { if (e.key === 'Enter') { performSearch(); searchInput.blur(); } };
    document.getElementById('search-btn').onclick = performSearch;

    function renderResults(posts, term = '') {
        if (posts.length === 0) {
            container.innerHTML = `
                <div class="text-center py-20">
                    <p class="text-gray-400 text-sm mb-4">"${term}" এর সাথে মেলে এমন কিছু পাওয়া যায়নি</p>
                    <button onclick="location.reload()" class="text-xs text-accent font-bold">আবার চেষ্টা করুন</button>
                </div>`;
            return;
        }
        container.innerHTML = posts.map(p => {
            let rawMsg = p.msg || '';
            const youtubeId = getYoutubeId(p.youtubeUrl || rawMsg);
            
            if (youtubeId) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = rawMsg;
                const iframes = tempDiv.getElementsByTagName('iframe');
                while(iframes.length > 0) iframes[0].parentNode.removeChild(iframes[0]);
                const links = tempDiv.getElementsByTagName('a');
                for (let i = links.length - 1; i >= 0; i--) {
                    if (links[i].href.includes('youtube.com') || links[i].href.includes('youtu.be')) {
                        links[i].parentNode.removeChild(links[i]);
                    }
                }
                rawMsg = tempDiv.innerHTML.replace(/(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/\S+/g, '');
            }

            const postImage = (p.image || p.imageUrl) ? `<img src="${p.image || p.imageUrl}" class="mt-3 rounded-lg w-full max-h-96 object-cover border dark:border-darkBorder">` : '';
            const youtubeEmbed = youtubeId ? `
                <div class="mt-3 aspect-video rounded-lg overflow-hidden border dark:border-darkBorder">
                    <iframe class="w-full h-full" src="https://www.youtube.com/embed/${youtubeId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>` : '';

            return `
            <div class="forum-card bg-white dark:bg-darkCard p-4 rounded-xl border dark:border-darkBorder shadow-sm" onclick="location.href='post.html?id=${p.id}'">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-2">
                        <img src="${p.photoURL || 'https://via.placeholder.com/20'}" class="w-5 h-5 rounded-full">
                        <span class="text-[11px] font-bold text-gray-500 uppercase truncate">${highlightText(p.name || 'Anonymous', term)}</span>
                        <span class="text-[10px] text-gray-300 whitespace-nowrap">• ${timeAgo(p.at?.seconds)}</span>
                    </div>
                    <div class="post-content text-sm leading-relaxed text-gray-800 dark:text-gray-200 line-clamp-3">
                        ${highlightText(rawMsg, term)}
                    </div>
                    ${postImage}
                    ${youtubeEmbed}
                </div>
            </div>`;
        }).join('');
    }

    document.addEventListener('click', (e) => {
        const isClickInsideSearch = document.querySelector('header').contains(e.target);
        const isClickInsideResults = container.contains(e.target);
        const isClickInsideHistory = historySection.contains(e.target);
        if (!isClickInsideSearch && !isClickInsideResults && !isClickInsideHistory) {
            if (searchInput.value.trim() === "" && container.innerHTML === "") {
                toggleMainSections(true);
                historySection.classList.add('hidden');
                searchInput.blur();
            }
        }
    });

</script>
</body>
</html>
