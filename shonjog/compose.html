<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নতুন লেখা - লেখক ফোরাম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        darkBg: '#0b0e11', 
                        darkCard: '#15191c', 
                        darkBorder: '#2d333b', 
                        accent: '#3498db'
                    } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; transition: all 0.3s; }
        .ql-container { font-family: 'Hind Siliguri', sans-serif; font-size: 1.1rem; border: none !important; }
        .ql-toolbar { border: none !important; border-bottom: 1px solid rgba(0,0,0,0.1) !important; border-radius: 12px 12px 0 0; }
        .dark .ql-toolbar { border-bottom: 1px solid #2d333b !important; background: #1a1f24; }
        .dark .ql-snow .ql-stroke { stroke: #e5e7eb; }
        .dark .ql-snow .ql-fill { fill: #e5e7eb; }
        .dark .ql-snow .ql-picker { color: #e5e7eb; }
        .ql-editor { min-height: 400px; line-height: 1.8; }
        .ql-editor iframe.ql-video { width: 100%; aspect-ratio: 16/9; border-radius: 12px; margin: 10px 0; }
        .ql-editor img { border-radius: 12px; margin: 10px 0; max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 antialiased">

<main class="max-w-3xl mx-auto px-4 py-4 md:py-8">
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="p-2 hover:bg-gray-200 dark:hover:bg-darkCard rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 id="page-title" class="text-xl font-bold">নতুন পোস্ট</h1>
        </div>
        <div class="flex gap-2">
            <button id="preview-btn" class="px-4 py-2 bg-gray-200 dark:bg-darkCard rounded-xl text-sm font-semibold hover:bg-gray-300 dark:hover:bg-gray-800 transition-all">প্রিভিউ</button>
            <button id="submit-post" class="px-6 py-2 bg-accent text-white rounded-xl text-sm font-bold shadow-lg shadow-accent/30 hover:scale-105 active:scale-95 transition-all">পাবলিশ</button>
        </div>
    </div>

    <div class="bg-white dark:bg-darkCard rounded-2xl border border-gray-200 dark:border-darkBorder overflow-hidden shadow-sm transition-all">
        <div id="editor"></div>
    </div>

    <div class="flex justify-between items-center mt-4 px-1">
        <div class="flex items-center gap-2">
            <div id="sync-icon" class="w-2 h-2 rounded-full bg-green-500"></div>
            <span id="draft-status" class="text-xs font-medium text-gray-500">অটো-সেভ সক্রিয়</span>
        </div>
        <div class="flex gap-4 text-xs font-medium text-gray-500">
            <span id="word-count">০ শব্দ</span>
            <span id="char-count">০ অক্ষর</span>
        </div>
    </div>
</main>

<div id="preview-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-[110] p-4 flex items-center justify-center">
    <div class="bg-white dark:bg-darkCard w-full max-w-2xl rounded-3xl p-6 md:p-8 max-h-[90vh] overflow-y-auto shadow-2xl relative">
        <button id="close-preview" class="absolute top-4 right-4 p-2 bg-gray-100 dark:bg-darkBg rounded-full hover:text-red-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div id="preview-content" class="prose prose-blue dark:prose-invert max-w-none mb-6"></div>
        <button id="edit-continue" class="mt-8 w-full py-4 bg-accent text-white rounded-2xl font-bold">সম্পাদনা চালিয়ে যান</button>
    </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCXGkduHCDLLNxkOU59asVJl5J3oOAp3HE",
        authDomain: "my-interactive-project-2b460.firebaseapp.com",
        projectId: "my-interactive-project-2b460",
        storageBucket: "my-interactive-project-2b460.firebasestorage.app",
        messagingSenderId: "196849485958",
        appId: "1:196849485958:web:fdd3b3d5e898cd197be907",
        measurementId: "G-HNHSWST7WS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const CLOUDINARY_CLOUD_NAME = "dnzao51g5";
    const CLOUDINARY_UPLOAD_PRESET = "ml_default"; 

    const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'আপনার মনের কথা এখানে লিখুন...',
        modules: {
            toolbar: {
                container: [
                    [{ 'header': [2, 3, false] }],
                    ['bold', 'italic', 'underline'],
                    ['blockquote', 'link', 'image', 'video'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ],
                handlers: {
                    image: imageHandler,
                    video: videoHandler
                }
            }
        }
    });

    async function imageHandler() {
        const input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.click();

        input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                if (data.secure_url) {
                    const range = quill.getSelection(true);
                    quill.insertEmbed(range.index, 'image', data.secure_url);
                    quill.setSelection(range.index + 1);
                } else {
                    alert('আপলোড ব্যর্থ হয়েছে');
                }
            } catch (err) {
                console.error(err);
                alert('সার্ভার ত্রুটি');
            }
        };
    }

    function videoHandler() {
        let url = prompt('ইউটিউব লিঙ্ক দিন:');
        if (url) {
            if (url.includes('watch?v=')) {
                url = url.replace('watch?v=', 'embed/');
            } else if (url.includes('youtu.be/')) {
                const id = url.split('/').pop();
                url = `https://www.youtube.com/embed/${id}`;
            }
            const range = quill.getSelection(true);
            quill.insertEmbed(range.index, 'video', url);
        }
    }

    let currentUser = null;
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');

    onAuthStateChanged(auth, async (user) => { 
        currentUser = user; 
        if (editId && user) {
            const docRef = doc(db, 'blog_comments/pages/forum_v2_voted', editId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists() && docSnap.data().uid === user.uid) {
                quill.root.innerHTML = docSnap.data().msg;
                document.getElementById('page-title').innerText = "পোস্ট সম্পাদনা";
                document.getElementById('submit-post').innerText = "আপডেট করুন";
            }
        }
    });

    quill.on('text-change', () => {
        const text = quill.getText().trim();
        document.getElementById('char-count').innerText = `${text.length} অক্ষর`;
        document.getElementById('word-count').innerText = `${text.length > 0 ? text.split(/\s+/).length : 0} শব্দ`;
    });

    const togglePreview = (show) => {
        const modal = document.getElementById('preview-modal');
        if(show) {
            document.getElementById('preview-content').innerHTML = quill.root.innerHTML;
            modal.classList.remove('hidden');
        } else { modal.classList.add('hidden'); }
    };

    document.getElementById('preview-btn').onclick = () => togglePreview(true);
    document.getElementById('close-preview').onclick = () => togglePreview(false);
    document.getElementById('edit-continue').onclick = () => togglePreview(false);

    document.getElementById('submit-post').onclick = async () => {
        const content = quill.root.innerHTML;
        if (!content || content === '<p><br></p>') return alert('কিছু লিখুন');
        if (!currentUser) return alert('লগইন করুন');
        
        try {
            const postData = {
                msg: content,
                at: serverTimestamp(),
                status: 'published'
            };

            if (editId) {
                await updateDoc(doc(db, 'blog_comments/pages/forum_v2_voted', editId), postData);
                alert('আপডেট করা হয়েছে');
            } else {
                await addDoc(collection(db, 'blog_comments/pages/forum_v2_voted'), {
                    ...postData,
                    name: currentUser.displayName || "অজ্ঞাত", 
                    uid: currentUser.uid,
                    photoURL: currentUser.photoURL || ""
                });
                alert('পাবলিশ করা হয়েছে');
            }
            location.href = 'index.html';
        } catch (e) { alert('ত্রুটি হয়েছে'); }
    };
</script>
</body>
</html>
