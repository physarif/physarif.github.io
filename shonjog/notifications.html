<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নোটিফিকেশন - লেখক ফোরাম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        darkBg: '#0b0e11', 
                        darkCard: '#15191c', 
                        darkBorder: '#2d333b', 
                        accent: '#3498db'
                    } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; transition: all 0.3s; }
        .notif-card { transition: all 0.2s; border-left: 4px solid transparent; }
        .notif-card.unread { background-color: #f0f7ff; border-left-color: #3498db; }
        .dark .notif-card.unread { background-color: #1a2229; border-left-color: #3498db; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100">

<main class="max-w-2xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <button onclick="location.href='index.html'" class="p-2 hover:bg-gray-100 dark:hover:bg-darkCard rounded-full transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-xl font-bold">নোটিফিকেশন</h1>
        </div>
        <div class="flex gap-3">
            <button id="mark-read-all" class="text-[11px] font-bold text-accent hover:underline">সব পড়া হয়েছে</button>
            <button id="clear-all" class="text-[11px] font-bold text-red-500 hover:underline">সব মুছুন</button>
        </div>
    </div>

    <div id="notif-container" class="space-y-3 pb-10">
        <div id="loading" class="flex justify-center py-20">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-accent"></div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, limit, doc, updateDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCXGkduHCDLLNxkOU59asVJl5J3oOAp3HE",
        authDomain: "my-interactive-project-2b460.firebaseapp.com",
        projectId: "my-interactive-project-2b460",
        storageBucket: "my-interactive-project-2b460.firebasestorage.app",
        messagingSenderId: "196849485958",
        appId: "1:196849485958:web:fdd3b3d5e898cd197be907",
        measurementId: "G-HNHSWST7WS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const container = document.getElementById('notif-container');

    let currentUser = null;

    function timeAgo(date) {
        if (!date) return "এখন";
        const seconds = Math.floor((new Date() - date) / 1000);
        let interval = Math.floor(seconds / 60);
        if (interval < 1) return "এইমাত্র";
        if (interval < 60) return interval + " মিনিট আগে";
        interval = Math.floor(interval / 60);
        if (interval < 24) return interval + " ঘণ্টা আগে";
        return Math.floor(interval / 24) + " দিন আগে";
    }

    function getIcon(type) {
        if (type === 'upvote') {
            return `<svg class="w-5 h-5 text-orange-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.293 9.707a1 1 0 010-1.414l6-6a1 1 0 011.414 0l6 6a1 1 0 01-1.414 1.414L11 5.414V17a1 1 0 11-2 0V5.414L4.707 9.707a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>`;
        }
        return `<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>`;
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            const path = `users/${user.uid}/notifications`;
            const q = query(collection(db, path), orderBy('at', 'desc'), limit(50));

            onSnapshot(q, (snapshot) => {
                const notifs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // শুধুমাত্র upvote এবং comments ফিল্টার করা
                const filtered = notifs.filter(n => n.type === 'upvote' || n.type === 'comments');

                if (filtered.length === 0) {
                    container.innerHTML = `<div class="text-center py-20 text-gray-400 italic">কোনো নোটিফিকেশন নেই</div>`;
                    return;
                }

                container.innerHTML = filtered.map(n => `
                    <div onclick="handleNotifClick('${n.id}', '${n.postId}')" 
                         class="notif-card ${n.read ? '' : 'unread'} bg-white dark:bg-darkCard p-4 rounded-xl border dark:border-darkBorder shadow-sm cursor-pointer flex gap-3">
                        <div class="w-10 h-10 bg-gray-50 dark:bg-gray-800/50 rounded-full flex items-center justify-center flex-shrink-0">
                            ${getIcon(n.type)}
                        </div>
                        <div class="flex-1">
                            <p class="text-[13px] ${n.read ? 'text-gray-600 dark:text-gray-400' : 'font-bold text-gray-900 dark:text-gray-100'} leading-snug">
                                ${n.message}
                            </p>
                            <span class="text-[10px] text-gray-400 mt-1 block uppercase font-medium">
                                ${n.at ? timeAgo(n.at.seconds * 1000) : 'এখন'}
                            </span>
                        </div>
                        ${!n.read ? '<div class="w-2 h-2 bg-accent rounded-full self-center"></div>' : ''}
                    </div>
                `).join('');
            });
        } else {
            container.innerHTML = `<div class="text-center py-20 text-gray-400 italic">লগইন করুন</div>`;
        }
    });

    window.handleNotifClick = async (id, postId) => {
        if (!currentUser) return;
        const docRef = doc(db, `users/${currentUser.uid}/notifications`, id);
        await updateDoc(docRef, { read: true });
        if (postId) location.href = `post.html?id=${postId}`;
    };

    document.getElementById('mark-read-all').onclick = async () => {
        if (!currentUser) return;
        const snap = await getDocs(collection(db, `users/${currentUser.uid}/notifications`));
        const batch = writeBatch(db);
        snap.docs.forEach(d => {
            if (!d.data().read && (d.data().type === 'upvote' || d.data().type === 'comments')) {
                batch.update(d.ref, { read: true });
            }
        });
        await batch.commit();
    };

    document.getElementById('clear-all').onclick = async () => {
        if (!currentUser || !confirm('সব আপবোট ও কমেন্ট নোটিফিকেশন মুছে ফেলতে চান?')) return;
        const snap = await getDocs(collection(db, `users/${currentUser.uid}/notifications`));
        const batch = writeBatch(db);
        snap.docs.forEach(d => {
            if (d.data().type === 'upvote' || d.data().type === 'comments') {
                batch.delete(d.ref);
            }
        });
        await batch.commit();
    };
</script>
</body>
</html>
